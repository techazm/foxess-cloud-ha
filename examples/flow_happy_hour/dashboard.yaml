# Flow Power dashboard (built-in cards only, no HACS): Live / Days / Months / Bill
# tabs like the Flow Power app (need flow_reports.yaml), plus the Happy Hour controls.
# Settings -> Dashboards -> Add dashboard -> open it -> ⋮ -> Edit -> ⋮ -> Raw configuration editor,
# then paste this file. Replace "fox_ess_inverter" with your device slug.
# Logbook card: automation entity IDs come from the aliases; check them under
# Settings -> Automations if a row shows as unknown.
title: Flow Power
views:
  # Live / Days / Months / Bill need flow_reports.yaml (+ flow_power_prices.yaml for PEA and price)
  - title: Live
    path: live
    icon: mdi:flash
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Right now
          - { type: tile, entity: sensor.fox_ess_inverter_battery_soc, name: Battery, color: green, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_price_now, name: Wholesale price, color: indigo, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.fox_ess_inverter_feed_in_power, name: Exporting, color: deep-orange, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.fox_ess_inverter_grid_consumption_power, name: Importing, color: red, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.fox_ess_inverter_load_power, name: House load, color: blue, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.fox_ess_inverter_pv_power, name: Solar, color: amber, grid_options: { columns: 6 } }
          - type: heading
            heading: Today
          - { type: tile, entity: sensor.hh_export_window, name: Exported since 5:30pm, color: deep-orange, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_happy_hour_earnings_tonight, name: Earnings tonight, color: blue, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.fox_ess_inverter_daily_feed_in, name: Exported in total, color: deep-orange, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.fox_ess_inverter_daily_grid_consumption, name: Electricity usage, color: red, grid_options: { columns: 6 } }
      - type: grid
        cards:
          - type: heading
            heading: Today's demand and price
          - type: history-graph
            hours_to_show: 24
            entities:
              - { entity: sensor.fox_ess_inverter_grid_consumption_power, name: Import }
              - { entity: sensor.fox_ess_inverter_feed_in_power, name: Export }
              - { entity: sensor.flow_price_now, name: Price }

  - title: Days
    path: days
    icon: mdi:calendar-today
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: entities
            entities:
              - { entity: sensor.flow_day, name: Day, icon: mdi:calendar }
              - type: buttons
                entities:
                  - { entity: script.flow_view_shift, name: Previous, icon: mdi:chevron-left, tap_action: { action: perform-action, perform_action: script.flow_view_shift, data: { days: -1 } } }
                  - { entity: script.flow_view_shift, name: Today, icon: mdi:calendar-today, tap_action: { action: perform-action, perform_action: script.flow_view_shift, data: { today: true } } }
                  - { entity: script.flow_view_shift, name: Next, icon: mdi:chevron-right, tap_action: { action: perform-action, perform_action: script.flow_view_shift, data: { days: 1 } } }
              - { entity: input_datetime.flow_view_date, name: Pick a date }
          - type: heading
            heading: "Plan: Happy Hour"
          - { type: tile, entity: sensor.flow_day_peak_export, name: Exported 5:30-9:30pm, icon: mdi:transmission-tower-export, color: deep-orange, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_day_earnings, name: Export earnings, icon: mdi:cash-plus, color: blue, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_day_export, name: Exported in total, icon: mdi:transmission-tower-export, color: blue, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_day_usage, name: Electricity usage, icon: mdi:transmission-tower-import, color: deep-orange, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_pea_30_days, name: Price adjustment (30-day), icon: mdi:percent-outline, color: deep-orange, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_day_adjustment, name: Total adjustment, icon: mdi:scale-balance, color: blue, grid_options: { columns: 6 } }
          - type: markdown
            content: >
              {% set v = state_attr('sensor.flow_day', 'v') %}
              {% if v and v.from == 'none' %}**No snapshot yet** for this day: the first is taken at midnight, or run *Backfill from history* (Bill tab).
              {% elif v and v.partial %}**No full data for this day** (tracking from {{ v.from }}; run *Backfill from history* on the Bill tab).{% endif %}
              _Today's Happy Hour is added at 21:30. PEA is Flow's provisional 30-day figure, not this day's;
              total adjustment = usage x PEA - export earnings (negative = credit)._
      - type: grid
        cards:
          - type: heading
            heading: Last 14 days
          - type: statistics-graph
            title: Energy
            period: day
            days_to_show: 14
            chart_type: bar
            stat_types: [change]
            entities:
              - { entity: sensor.flow_happy_hour_export_total, name: Exported 5:30-9:30pm }
              - { entity: sensor.fox_ess_inverter_daily_feed_in, name: Exported in total }
              - { entity: sensor.hh_import_total, name: Usage }
          - type: statistics-graph
            title: Export earnings
            period: day
            days_to_show: 14
            chart_type: bar
            stat_types: [change]
            entities:
              - { entity: sensor.flow_happy_hour_earnings_total, name: Earnings }

  - title: Months
    path: months
    icon: mdi:calendar-month
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: entities
            entities:
              - { entity: sensor.flow_month, name: Month, icon: mdi:calendar-month }
              - type: buttons
                entities:
                  - { entity: script.flow_view_shift, name: Previous, icon: mdi:chevron-left, tap_action: { action: perform-action, perform_action: script.flow_view_shift, data: { months: -1 } } }
                  - { entity: script.flow_view_shift, name: This month, icon: mdi:calendar-today, tap_action: { action: perform-action, perform_action: script.flow_view_shift, data: { today: true } } }
                  - { entity: script.flow_view_shift, name: Next, icon: mdi:chevron-right, tap_action: { action: perform-action, perform_action: script.flow_view_shift, data: { months: 1 } } }
          - type: heading
            heading: "Plan: Happy Hour"
          - { type: tile, entity: sensor.flow_month_peak_export, name: Exported 5:30-9:30pm, icon: mdi:transmission-tower-export, color: deep-orange, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_month_earnings, name: Export earnings, icon: mdi:cash-plus, color: blue, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_month_export, name: Exported in total, icon: mdi:transmission-tower-export, color: blue, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_month_usage, name: Electricity usage, icon: mdi:transmission-tower-import, color: deep-orange, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_pea_30_days, name: Price adjustment (30-day), icon: mdi:percent-outline, color: deep-orange, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_month_adjustment, name: Total adjustment, icon: mdi:scale-balance, color: blue, grid_options: { columns: 6 } }
          - type: markdown
            content: >
              {% set v = state_attr('sensor.flow_month', 'v') %}
              {% if v and v.from == 'none' %}**No snapshot yet** for this month.
              {% elif v and v.partial %}**Part month:** tracking from {{ v.from }}.{% endif %}
              _PEA is Flow's provisional 30-day figure; the bill uses the PEA for its own period._
      - type: grid
        cards:
          - type: heading
            heading: Monthly comparison
          - type: statistics-graph
            title: Energy
            period: month
            days_to_show: 365
            chart_type: bar
            stat_types: [change]
            entities:
              - { entity: sensor.flow_happy_hour_export_total, name: Exported 5:30-9:30pm }
              - { entity: sensor.fox_ess_inverter_daily_feed_in, name: Exported in total }
              - { entity: sensor.hh_import_total, name: Usage }
          - type: statistics-graph
            title: Export earnings
            period: month
            days_to_show: 365
            chart_type: bar
            stat_types: [change]
            entities:
              - { entity: sensor.flow_happy_hour_earnings_total, name: Earnings }

  - title: Bill
    path: bill
    icon: mdi:receipt-text-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: entities
            entities:
              - { entity: sensor.flow_bill, name: Current bill, icon: mdi:calendar-start }
              - { entity: sensor.flow_bill_days, name: Days so far }
              - { entity: input_datetime.flow_bill_start, name: Bill start (edit to correct) }
              - { entity: input_number.flow_bill_day, name: Bill day (0 = not known yet) }
          - type: heading
            heading: Since last bill
          - { type: tile, entity: sensor.flow_bill_usage, name: Electricity usage, icon: mdi:transmission-tower-import, color: deep-orange, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_bill_usage_cost, name: Usage charge, icon: mdi:cash-minus, color: deep-orange, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_bill_peak_export, name: Exported 5:30-9:30pm, icon: mdi:transmission-tower-export, color: blue, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_bill_supply, name: Supply charge, icon: mdi:cash-minus, color: deep-orange, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_bill_earnings, name: Export earnings, icon: mdi:cash-plus, color: blue, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_bill_adjustment, name: Total adjustment, icon: mdi:scale-balance, color: blue, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_bill_estimate, name: Estimated bill (negative = credit), icon: mdi:receipt-text-outline, color: indigo }
          - type: markdown
            content: >
              {% set v = state_attr('sensor.flow_bill', 'v') %}
              {% if v and v.from == 'none' %}**No snapshot yet:** run *Backfill from history* below.
              {% elif v and v.partial %}**Part period:** tracking from {{ v.from }}; fill the "Before tracking" helpers for the days before.{% endif %}
              _Estimated bill = usage x {{ (states('input_number.flow_rate_import') | float(0) * 100) | round(2) }}c
              + supply + total adjustment. PEA is the 30-day figure ({{ states('sensor.flow_pea_30_days') }}c/kWh), not this bill's._
          - type: heading
            heading: Forecast for this bill
          - { type: tile, entity: sensor.flow_bill_forecast_total, name: Forecast bill (negative = credit), icon: mdi:crystal-ball, color: indigo }
          - { type: tile, entity: sensor.flow_bill_forecast_earnings, name: Export earnings, icon: mdi:cash-plus, color: blue, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_bill_forecast_peak_export, name: Exported 5:30-9:30pm, icon: mdi:transmission-tower-export, color: blue, grid_options: { columns: 6 } }
          - { type: tile, entity: sensor.flow_bill_forecast_usage, name: Electricity usage, icon: mdi:transmission-tower-import, color: deep-orange, grid_options: { columns: 6 } }
          - type: markdown
            grid_options: { columns: 6 }
            content: >
              {% set f = state_attr('sensor.flow_bill_forecast', 'f') %}
              {% if f %}Period ends **{{ as_timestamp(f.end ~ 'T12:00:00') | timestamp_custom('%a %-d %b') }}**, {{ f.days_left }} of {{ f.days_total }} days left.{% else %}Set the bill start.{% endif %}
          - type: markdown
            content: >
              {% set f = state_attr('sensor.flow_bill_forecast', 'f') %}
              {% if f %}_So far through yesterday + the daily average of the last {{ f.avg_days }} day(s) x days left (incl. today).
              Supply ${{ f.supply }} for {{ f.days_total }} days, total adjustment ${{ f.adjustment }}.
              Period end assumes a monthly bill{% if states('input_number.flow_bill_day') | int(0) == 0 %} a month after the bill start (bill day not known yet){% endif %}._{% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Settings
          - type: entities
            state_color: false
            entities:
              - entity: script.flow_reports_backfill
                name: Backfill from history (one-off, fills days before tracking)
                icon: mdi:history
              - type: section
                label: Rates
              - input_number.flow_rate_hh_high
              - input_number.flow_rate_hh_low
              - input_number.flow_rate_hh_cap
              - input_number.flow_rate_import
              - input_number.flow_rate_supply
              - type: section
                label: Before tracking (gap before the first snapshot)
              - input_number.flow_bill_pre_import_kwh
              - input_number.flow_bill_pre_hh_high_kwh
              - input_number.flow_bill_pre_hh_low_kwh
              - input_number.flow_bill_pre_revenue
              - type: section
                label: Lifetime Happy Hour totals
              - input_number.flow_hh_high_kwh_total
              - input_number.flow_hh_low_kwh_total
              - input_number.flow_hh_revenue_total
              - input_datetime.flow_hh_last_close

  - title: Happy Hour
    path: happy-hour
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Tonight
          - type: markdown
            content: |
              {% set soc = states('sensor.fox_ess_inverter_battery_soc') | float(0) %}
              {% set res = states('sensor.hh_reserve_soc') | float(0) %}
              {% set cut = states('input_number.hh_cutoff_soc') | float(0) %}
              {% set cap = states('input_number.hh_cap_kwh') | float(15) %}
              {% set exp = states('sensor.hh_export_window') | float(0) %}
              {% set fc = 'sensor.energy_production_tomorrow' %}
              {% set t = now().strftime('%H:%M') %}
              {% if is_state('input_boolean.hh_enabled', 'off') %}**Optimiser off** - the inverter runs whatever schedule is set.
              {% elif t < '17:20' %}Arms at **17:20** with cut-off **{{ res | int }}%**.
              {% elif t < '17:30' %}Armed: force discharge from 17:30 down to **{{ cut | int }}%**.
              {% elif t < '21:30' %}{% if exp < cap %}Discharging to **{{ cut | int }}%**, {{ (cap - exp) | round(1) }} kWh left at 35c.{% else %}35c cap reached ({{ exp | round(1) }} kWh).{% endif %}
              {% else %}Self-use overnight. 08:00 target **{{ states('input_number.hh_morning_target_soc') | int }}%**.{% endif %}
              {% if is_state('input_boolean.hh_dry_run', 'on') %}_(dry run: no inverter writes)_{% endif %}

              | | |
              |---|---|
              | Battery | {{ soc | int }}% |
              | Reserve now / armed cut-off | {{ res | int }}% / {{ cut | int }}% |
              | Surplus above reserve | {{ states('sensor.hh_surplus_kwh') }} kWh |
              | Export since last 17:30 | {{ exp | round(2) }} / {{ cap }} kWh |
              | Overnight load (learned) | {{ states('input_number.hh_overnight_load_avg_kwh') }} kWh |
              | Margin (base + learned) | {{ states('input_number.hh_reserve_margin_pct') | int }}% + {{ states('input_number.hh_margin_bump_pct') | int }}% |
              | Solar tomorrow | {% if has_value(fc) %}{{ states(fc) }} kWh{% if states(fc) | float(0) < states('input_number.hh_poor_solar_kwh') | float(30) %} (poor: +{{ states('input_number.hh_poor_solar_extra_kwh') }} kWh reserve){% endif %}{% else %}no forecast{% endif %} |
              | Price now | ${{ states('sensor.flow_price_now') }}/kWh |
              | Next spike | {% if has_value('sensor.flow_price_spike_start') %}{{ as_timestamp(states('sensor.flow_price_spike_start')) | timestamp_custom('%a %H:%M') }}-{{ as_timestamp(states('sensor.flow_price_spike_end')) | timestamp_custom('%H:%M') }}{% else %}none forecast{% endif %} |
              | SoC at last 21:30 | {{ states('input_number.hh_soc_at_2130') | int }}% |
          - type: gauge
            entity: sensor.fox_ess_inverter_battery_soc
            name: Battery
            needle: true
            min: 0
            max: 100
            segments:
              - { from: 0, color: "#db4437" }
              - { from: 40, color: "#ffa600" }
              - { from: 60, color: "#43a047" }
          - type: gauge
            entity: sensor.hh_export_window
            name: Export since 17:30
            unit: kWh
            needle: true
            min: 0
            max: 20
            segments:
              - { from: 0, color: "#43a047" }
              - { from: 15, color: "#ffa600" }

      - type: grid
        cards:
          - type: heading
            heading: Graphs
          - type: history-graph
            title: Battery vs plan (24 h)
            hours_to_show: 24
            entities:
              - entity: sensor.fox_ess_inverter_battery_soc
                name: Battery
              - entity: sensor.hh_reserve_soc
                name: Reserve (live)
              - entity: input_number.hh_cutoff_soc
                name: Armed cut-off
              - entity: input_number.hh_morning_target_soc
                name: 08:00 target
          - type: history-graph
            title: Export window (24 h)
            hours_to_show: 24
            entities:
              - entity: sensor.hh_export_window
                name: Export since 17:30
              - entity: input_number.hh_cap_kwh
                name: 35c cap
          - type: history-graph
            title: Wholesale price (48 h)
            hours_to_show: 48
            entities:
              - entity: sensor.flow_price_now
                name: Now
              - entity: sensor.flow_price_forecast_max_24h
                name: Forecast max 24 h
              - entity: input_number.flow_spike_threshold
                name: Spike threshold
              - entity: binary_sensor.flow_price_spike_active
                name: Spike
          - type: statistics-graph
            title: Daily energy (14 days)
            period: day
            days_to_show: 14
            chart_type: bar
            stat_types: [change]
            entities:
              - entity: sensor.hh_export_window
                name: Grid export
              - entity: sensor.hh_import_total
                name: Grid import
              - entity: sensor.hh_load_total
                name: House load

      - type: grid
        cards:
          - type: heading
            heading: Controls
          - type: entities
            entities:
              - input_boolean.hh_enabled
              - input_boolean.hh_dry_run
              - type: section
                label: Plan
              - input_number.hh_morning_target_soc
              - input_number.hh_floor_soc
              - input_number.hh_reserve_margin_pct
              - input_number.hh_margin_bump_pct
              - input_number.hh_fd_power_w
              - input_number.hh_cap_kwh
              - input_number.hh_surplus_min_kwh
              - type: section
                label: Extras
              - input_number.hh_poor_solar_kwh
              - input_number.hh_poor_solar_extra_kwh
              - input_number.hh_spike_extra_kwh
              - input_number.flow_spike_threshold
              - input_number.hh_import_alert_kwh
          - type: heading
            heading: Flow Power
          - type: entities
            entities:
              - entity: sensor.flow_price_now
                name: Price now
              - entity: sensor.flow_price_forecast_max_24h
                name: Forecast max 24 h
              - entity: binary_sensor.flow_price_spike_active
                name: Spike active
              - entity: sensor.flow_pea_30_days
                name: PEA 30 days
              - entity: sensor.flow_pea_30_days_imports
                name: PEA imports 30 days
              - entity: sensor.flow_load_weighted_price_30_days
                name: Import price 30 days
          - type: logbook
            title: What happened (48 h)
            hours_to_show: 48
            target:
              entity_id:
                - automation.happy_hour_arm_tonight
                - automation.happy_hour_refresh_before_window
                - automation.happy_hour_35c_cap_reached
                - automation.happy_hour_snapshot_21_30
                - automation.happy_hour_learn_overnight_load
                - automation.flow_price_spike_forecast
                - automation.flow_bill_add_happy_hour
                - automation.flow_bill_new_period_on_bill_day
                - input_datetime.flow_bill_start
                - input_number.hh_margin_bump_pct
