# Flow Power "since last bill" tracker (Home Assistant package)
# Optional companion to flow_happy_hour.yaml: uses its hh_export_window and
# hh_import_total meters. flow_power_prices.yaml is optional; without it the
# PEA estimate is "unknown".
#
# How it works
#   - Lifetime counters never reset: hh_import_total (grid import) and the
#     Happy Hour totals below, closed once a day at 21:30 after a refresh:
#       min(window, cap) x high rate + max(window - cap, 0) x low rate
#   - sensor.flow_bill_daily_log snapshots those counters at 00:00 every day
#     (last 100 days, survives restarts).
#   - "Since last bill" = counters now - snapshot on input_datetime.flow_bill_start.
#     Nothing is ever zeroed, so moving the bill start (by hand or on bill day)
#     recalculates exactly, back to the oldest snapshot.
#   - Bill day unknown? Set the bill start to your switch date. Setting it by
#     hand also sets flow_bill_day (monthly auto-advance). When the real bill
#     arrives, set the bill start to the day after its period ends.
#   - Before the first snapshot there is no data; the flow_bill_pre_* helpers
#     cover that gap (e.g. switch date -> install date), from the Flow app.
#
# Cost = import kWh x import rate + days x daily supply. Net = revenue - cost.
# PEA = Flow's 30-day rolling PEA x this bill's import kWh: an estimate only,
# not aligned to the bill period.
# Helpers have no `initial`, so edits survive restarts; flow_bill_seed fills in
# default rates while they are 0.
# Replace "fox_ess_inverter" with your device slug, as in flow_happy_hour.yaml.

input_number:
  # Tariff (Endeavour, Oct 2026 defaults set by flow_bill_seed)
  flow_rate_hh_high: { name: Happy Hour export rate up to cap, min: 0, max: 2,   step: 0.0001, mode: box, unit_of_measurement: "$/kWh" }
  flow_rate_hh_low:  { name: Happy Hour export rate above cap, min: 0, max: 2,   step: 0.0001, mode: box, unit_of_measurement: "$/kWh" }
  flow_rate_hh_cap:  { name: Happy Hour high-rate cap per day, min: 0, max: 100, step: 0.1,    mode: box, unit_of_measurement: kWh }
  flow_rate_import:  { name: Import rate before PEA,          min: 0, max: 2,   step: 0.0001, mode: box, unit_of_measurement: "$/kWh" }
  flow_rate_supply:  { name: Daily supply charge,             min: 0, max: 10,  step: 0.0001, mode: box, unit_of_measurement: "$/day" }
  # 0 = unknown (no auto-advance). Learned when you set the bill start by hand.
  flow_bill_day:     { name: Bill day of month (0 = unknown), min: 0, max: 31,  step: 1,      mode: box }
  # Lifetime Happy Hour totals (never reset; written at 21:30)
  flow_hh_high_kwh_total: { name: Happy Hour kWh at high rate (lifetime), min: 0, max: 10000000, step: 0.01, mode: box, unit_of_measurement: kWh }
  flow_hh_low_kwh_total:  { name: Happy Hour kWh at low rate (lifetime),  min: 0, max: 10000000, step: 0.01, mode: box, unit_of_measurement: kWh }
  flow_hh_revenue_total:  { name: Happy Hour revenue (lifetime),          min: 0, max: 10000000, step: 0.01, mode: box, unit_of_measurement: "$" }
  # Gap before the first snapshot: used only while the bill start is earlier than it
  flow_bill_pre_import_kwh:  { name: Before tracking - import,               min: 0, max: 100000, step: 0.01, mode: box, unit_of_measurement: kWh }
  flow_bill_pre_hh_high_kwh: { name: Before tracking - Happy Hour high kWh,  min: 0, max: 100000, step: 0.01, mode: box, unit_of_measurement: kWh }
  flow_bill_pre_hh_low_kwh:  { name: Before tracking - Happy Hour low kWh,   min: 0, max: 100000, step: 0.01, mode: box, unit_of_measurement: kWh }
  flow_bill_pre_revenue:     { name: Before tracking - Happy Hour revenue,   min: 0, max: 100000, step: 0.01, mode: box, unit_of_measurement: "$" }

input_datetime:
  flow_bill_start:    { name: Bill start,             has_date: true, has_time: false }
  flow_hh_last_close: { name: Happy Hour last closed, has_date: true, has_time: false }

template:
  # Daily snapshot of [import, hh high kWh, hh low kWh, revenue], keyed by date.
  # On start, today's entry is added if missing and Happy Hour hasn't run yet.
  - triggers:
      - { trigger: time, at: "00:00:10", id: midnight }
      - { trigger: homeassistant, event: start, id: start }
    sensor:
      - name: Flow bill daily log
        unique_id: flow_bill_daily_log
        icon: mdi:notebook-outline
        state: "{{ now().date() | string }}"
        attributes:
          days: >
            {% set old = this.attributes.get('days', {}) %}
            {% set today = now().date() | string %}
            {% set add = has_value('sensor.hh_import_total')
                         and (trigger.id == 'midnight' or (today not in old and now() < today_at('17:30'))) %}
            {% set row = [states('sensor.hh_import_total') | float(0),
                          states('input_number.flow_hh_high_kwh_total') | float(0),
                          states('input_number.flow_hh_low_kwh_total') | float(0),
                          states('input_number.flow_hh_revenue_total') | float(0)] %}
            {% set new = dict(old, **{today: row}) if add else old %}
            {% set ns = namespace(d={}) %}
            {% for k in (new | list | sort)[-100:] %}{% set ns.d = dict(ns.d, **{k: new[k]}) %}{% endfor %}
            {{ ns.d }}

  - sensor:
      # State: date of the snapshot used. base: counters at bill start
      # (first snapshot on/after the bill start, minus the pre-tracking gap if earlier).
      - name: Flow bill baseline
        unique_id: flow_bill_baseline
        icon: mdi:calendar-start
        state: >
          {% set k = (state_attr('sensor.flow_bill_daily_log', 'days') or {}) | list | select('>=', states('input_datetime.flow_bill_start')) | sort | list %}
          {{ k[0] if k else 'none' }}
        attributes:
          base: >
            {% set log = state_attr('sensor.flow_bill_daily_log', 'days') or {} %}
            {% set start = states('input_datetime.flow_bill_start') %}
            {% set keys = log | list | sort %}
            {% set k = keys | select('>=', start) | list %}
            {% if k %}
              {% set b = log[k[0]] %}
              {% set pre = 1 if start < keys[0] else 0 %}
              {{ [b[0] - pre * states('input_number.flow_bill_pre_import_kwh') | float(0),
                  b[1] - pre * states('input_number.flow_bill_pre_hh_high_kwh') | float(0),
                  b[2] - pre * states('input_number.flow_bill_pre_hh_low_kwh') | float(0),
                  b[3] - pre * states('input_number.flow_bill_pre_revenue') | float(0)] }}
            {% else %}[]{% endif %}

      - name: Flow bill days
        unique_id: flow_bill_days
        unit_of_measurement: d
        # Includes today: supply is charged for every day of the period
        state: >
          {% set s = state_attr('input_datetime.flow_bill_start', 'timestamp') %}
          {{ ((as_timestamp(today_at()) - s) / 86400) | round(0) | int + 1 if s is number else none }}

      - name: Flow bill import
        unique_id: flow_bill_import
        unit_of_measurement: kWh
        state: >
          {% set b = state_attr('sensor.flow_bill_baseline', 'base') or [] %}
          {{ (states('sensor.hh_import_total') | float - b[0]) | round(2)
             if b | count == 4 and has_value('sensor.hh_import_total') else none }}

      - name: Flow bill Happy Hour high kWh
        unique_id: flow_bill_hh_high_kwh
        unit_of_measurement: kWh
        state: >
          {% set b = state_attr('sensor.flow_bill_baseline', 'base') or [] %}
          {{ (states('input_number.flow_hh_high_kwh_total') | float(0) - b[1]) | round(2) if b | count == 4 else none }}

      - name: Flow bill Happy Hour low kWh
        unique_id: flow_bill_hh_low_kwh
        unit_of_measurement: kWh
        state: >
          {% set b = state_attr('sensor.flow_bill_baseline', 'base') or [] %}
          {{ (states('input_number.flow_hh_low_kwh_total') | float(0) - b[2]) | round(2) if b | count == 4 else none }}

      - name: Flow bill revenue
        unique_id: flow_bill_revenue
        unit_of_measurement: "$"
        state: >
          {% set b = state_attr('sensor.flow_bill_baseline', 'base') or [] %}
          {{ (states('input_number.flow_hh_revenue_total') | float(0) - b[3]) | round(2) if b | count == 4 else none }}

      - name: Flow bill cost
        unique_id: flow_bill_cost
        unit_of_measurement: "$"
        state: >
          {% if has_value('sensor.flow_bill_import') and has_value('sensor.flow_bill_days') %}
            {{ (states('sensor.flow_bill_import') | float * states('input_number.flow_rate_import') | float(0)
                + states('sensor.flow_bill_days') | int * states('input_number.flow_rate_supply') | float(0)) | round(2) }}
          {% else %}none{% endif %}

      - name: Flow bill net
        unique_id: flow_bill_net
        unit_of_measurement: "$"
        state: >
          {{ (states('sensor.flow_bill_revenue') | float - states('sensor.flow_bill_cost') | float) | round(2)
             if has_value('sensor.flow_bill_revenue') and has_value('sensor.flow_bill_cost') else none }}

      # Positive = PEA adds to the bill. 30-day rolling, NOT bill-aligned.
      - name: Flow bill PEA estimate
        unique_id: flow_bill_pea_estimate
        unit_of_measurement: "$"
        state: >
          {% set pea = states('sensor.flow_pea_30_days') %}
          {{ (states('sensor.flow_bill_import') | float(0) * pea | float / 100) | round(2) if is_number(pea) else none }}

automation:
  # Default rates while still 0; a bill start if none is set yet
  - id: flow_bill_seed
    alias: Flow bill - seed defaults
    triggers:
      - { trigger: homeassistant, event: start }
      - { trigger: event, event_type: automation_reloaded }
    actions:
      - repeat:
          for_each:
            - { entity: input_number.flow_rate_hh_high, value: 0.35 }
            - { entity: input_number.flow_rate_hh_low,  value: 0.10 }
            - { entity: input_number.flow_rate_hh_cap,  value: 15 }
            - { entity: input_number.flow_rate_import,  value: 0.4226 }
            - { entity: input_number.flow_rate_supply,  value: 2.2256 }
          sequence:
            - if: "{{ states(repeat.item.entity) | float(0) == 0 }}"
              then:
                - action: input_number.set_value
                  target: { entity_id: "{{ repeat.item.entity }}" }
                  data: { value: "{{ repeat.item.value }}" }
      - if: "{{ state_attr('input_datetime.flow_bill_start', 'year') | int(0) < 2000 }}"
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.flow_bill_start }
            data: { date: "{{ now().date() }}" }
          - action: notify.notify
            data:
              title: Flow bill tracker
              message: >
                Set the bill start to your last bill's start (or your switch date if no bill yet),
                and fill the "Before tracking" helpers for the days before today.

  # 21:30 - refresh, then add tonight's Happy Hour to the lifetime totals (once per window)
  - id: flow_bill_close_happy_hour
    alias: Flow bill - add Happy Hour
    mode: single
    triggers:
      - { trigger: time, at: "21:30:00" }
      # Catch-up if HA was down at 21:30. Only before 06:00, while the window
      # counter can't yet hold 0c morning solar export.
      - { trigger: homeassistant, event: start }
    variables:
      window_day: "{{ (now() if now() >= today_at('17:30') else now() - timedelta(days=1)).date() | string }}"
    conditions:
      - "{{ now() >= today_at('21:30') or now() < today_at('06:00') }}"
      - "{{ states('input_datetime.flow_hh_last_close') != window_day }}"
    actions:
      - action: button.press
        target: { entity_id: button.fox_ess_inverter_refresh_all_data }
        continue_on_error: true
      - delay: "00:01:00"
      - wait_template: "{{ has_value('sensor.hh_export_window') }}"
        timeout: "00:05:00"
        continue_on_timeout: false
      - variables:
          kwh: "{{ states('sensor.hh_export_window') | float(0) }}"
          cap: "{{ states('input_number.flow_rate_hh_cap') | float(15) }}"
          high: "{{ [kwh, cap] | min }}"
          low: "{{ [kwh - cap, 0] | max }}"
          amount: >
            {{ high * states('input_number.flow_rate_hh_high') | float(0)
               + low * states('input_number.flow_rate_hh_low') | float(0) }}
      - action: input_number.set_value
        target: { entity_id: input_number.flow_hh_high_kwh_total }
        data: { value: "{{ (states('input_number.flow_hh_high_kwh_total') | float(0) + high) | round(2) }}" }
      - action: input_number.set_value
        target: { entity_id: input_number.flow_hh_low_kwh_total }
        data: { value: "{{ (states('input_number.flow_hh_low_kwh_total') | float(0) + low) | round(2) }}" }
      - action: input_number.set_value
        target: { entity_id: input_number.flow_hh_revenue_total }
        data: { value: "{{ (states('input_number.flow_hh_revenue_total') | float(0) + amount) | round(2) }}" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.flow_hh_last_close }
        data: { date: "{{ window_day }}" }

  # You set the bill start by hand -> learn the bill day for monthly auto-advance
  - id: flow_bill_learn_day
    alias: Flow bill - learn bill day
    triggers: [{ trigger: state, entity_id: input_datetime.flow_bill_start }]
    conditions:
      - "{{ trigger.to_state.context.user_id is not none and state_attr('input_datetime.flow_bill_start', 'day') is number }}"
    actions:
      - action: input_number.set_value
        target: { entity_id: input_number.flow_bill_day }
        data: { value: "{{ state_attr('input_datetime.flow_bill_start', 'day') }}" }

  # Bill day - summarise the closing period, then move the bill start to today
  - id: flow_bill_reset
    alias: Flow bill - new period on bill day
    triggers: [{ trigger: time, at: "00:00:30" }]
    variables:
      bill_day: >
        {% set last = ((now().replace(day=28) + timedelta(days=4)).replace(day=1) - timedelta(days=1)).day %}
        {{ [states('input_number.flow_bill_day') | int(0), last] | min }}
    conditions:
      - "{{ bill_day > 0 and now().day == bill_day and states('input_datetime.flow_bill_start') != now().date() | string }}"
    actions:
      - action: notify.notify
        data:
          title: Flow bill period closed (estimate)
          message: >
            {{ states('input_datetime.flow_bill_start') }} to yesterday ({{ states('sensor.flow_bill_days') | int(1) - 1 }} days):
            import {{ states('sensor.flow_bill_import') }} kWh, Happy Hour ${{ states('sensor.flow_bill_revenue') }},
            net ${{ (states('sensor.flow_bill_net') | float(0) + states('input_number.flow_rate_supply') | float(0)) | round(2) }} before PEA.
            If the bill's dates differ, set the bill start to match: figures recalculate.
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.flow_bill_start }
        data: { date: "{{ now().date() }}" }
