# Flow Power Happy Hour optimiser for FoxESS KH10 + CQ6 (Home Assistant package)
# Requires the foxess_cloud integration >= 1.1.1 (set_schedule service).
# Drop into config/packages/ and enable packages in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# See README.md for tuning and testing.
#
# Entity IDs assume the default device name "Fox ESS 60KB103062CB096".
# If yours differ, search/replace "fox_ess_60kb103062cb096".
#   sensor.fox_ess_60kb103062cb096_battery_soc             battery SoC (%)
#   sensor.fox_ess_60kb103062cb096_daily_feed_in           export today (kWh, ~15 min updates)
#   sensor.fox_ess_60kb103062cb096_daily_grid_consumption  import today (kWh)
#   sensor.fox_ess_60kb103062cb096_daily_load              house load today (kWh)
#   button.fox_ess_60kb103062cb096_refresh_all_data
#   sensor.energy_production_tomorrow           tomorrow's PV forecast (kWh), optional.
#     Solcast (HACS) or Forecast.Solar (built-in: sensor.energy_production_tomorrow).
#     If the sensor is missing or unavailable, no poor-solar extra is added and
#     the 10c top-up isn't blocked by the forecast.
#   notify.notify                                          your notifier

input_boolean:
  hh_enabled:
    name: Happy Hour optimiser enabled
    icon: mdi:battery-sync
  hh_dry_run:
    name: Happy Hour dry run (notify only, no inverter writes)
    icon: mdi:test-tube

input_number:
  hh_battery_usable_kwh:   { name: Battery usable kWh,          min: 10, max: 60,  step: 0.5, initial: 38,   unit_of_measurement: kWh }
  hh_cap_kwh:              { name: Happy Hour 35c cap,          min: 0,  max: 30,  step: 0.5, initial: 15,   unit_of_measurement: kWh }
  hh_fd_power_w:           { name: Force discharge power,       min: 1000, max: 10000, step: 100, initial: 5500, unit_of_measurement: W }
  hh_floor_soc:            { name: Floor SoC,                   min: 10, max: 50,  step: 1,   initial: 10,   unit_of_measurement: "%" }
  hh_reserve_margin_pct:   { name: Reserve margin,              min: 0,  max: 50,  step: 1,   initial: 15,   unit_of_measurement: "%" }
  hh_morning_buffer_kwh:   { name: Morning buffer (07:00 until PV covers load), min: 0, max: 10, step: 0.5, initial: 2, unit_of_measurement: kWh }
  hh_poor_solar_kwh:       { name: Poor solar day threshold,    min: 0,  max: 100, step: 1,   initial: 30,   unit_of_measurement: kWh }
  hh_poor_solar_extra_kwh: { name: Extra reserve on poor solar, min: 0,  max: 20,  step: 0.5, initial: 5,    unit_of_measurement: kWh }
  hh_surplus_min_kwh:      { name: Min surplus to sell at 10c,  min: 0,  max: 20,  step: 0.5, initial: 3,    unit_of_measurement: kWh }
  # Learned / state values (written by automations)
  hh_overnight_load_avg_kwh: { name: Overnight load avg (21:30-07:00), min: 0, max: 60, step: 0.01, initial: 6, unit_of_measurement: kWh, mode: box }
  hh_load_at_2130:         { name: Load meter at 21:30,   min: 0, max: 10000000, step: 0.01, mode: box }
  hh_import_at_2130:       { name: Import meter at 21:30, min: 0, max: 10000000, step: 0.01, mode: box }

utility_meter:
  # Happy Hour export counter, reset at 17:30 every day
  hh_export_window:
    source: sensor.fox_ess_60kb103062cb096_daily_feed_in
    cron: "30 17 * * *"
  # Never-resetting totals built from the daily sensors, so 21:30 -> 07:00
  # differences survive the midnight reset
  hh_load_total:
    source: sensor.fox_ess_60kb103062cb096_daily_load
  hh_import_total:
    source: sensor.fox_ess_60kb103062cb096_daily_grid_consumption

template:
  - sensor:
      - name: HH reserve SoC
        unique_id: hh_reserve_soc
        unit_of_measurement: "%"
        state: >
          {% set usable = states('input_number.hh_battery_usable_kwh') | float(38) %}
          {% set night  = states('input_number.hh_overnight_load_avg_kwh') | float(6) %}
          {% set morn   = states('input_number.hh_morning_buffer_kwh') | float(2) %}
          {% set margin = states('input_number.hh_reserve_margin_pct') | float(15) / 100 %}
          {% set floor  = states('input_number.hh_floor_soc') | float(10) %}
          {% set fc     = 'sensor.energy_production_tomorrow' %}
          {% set poor   = has_value(fc) and states(fc) | float(0) < states('input_number.hh_poor_solar_kwh') | float(30) %}
          {% set extra  = states('input_number.hh_poor_solar_extra_kwh') | float(5) if poor else 0 %}
          {% set kwh = (night + morn) * (1 + margin) + extra %}
          {{ [[floor + kwh / usable * 100, floor] | max, 95] | min | round(0) }}

      - name: HH surplus kWh
        unique_id: hh_surplus_kwh
        unit_of_measurement: kWh
        state: >
          {% set soc = states('sensor.fox_ess_60kb103062cb096_battery_soc') | float(0) %}
          {% set res = states('sensor.hh_reserve_soc') | float(100) %}
          {{ ((soc - res) / 100 * states('input_number.hh_battery_usable_kwh') | float(38)) | round(2) }}

script:
  # Single write path to the inverter: always writes the full 3-block day.
  foxess_apply_schedule:
    alias: FoxESS apply Happy Hour schedule
    mode: queued
    fields:
      fd_enabled: { description: Force discharge 17:30-21:29 on/off }
      fd_soc:     { description: Discharge cut-off SoC (%) }
      fd_power:   { description: Discharge power to grid (W) }
    variables:
      floor: "{{ states('input_number.hh_floor_soc') | int(10) }}"
      evening: >
        {% if fd_enabled %}
          {{ {"start": "17:30", "end": "21:29", "work_mode": "ForceDischarge",
              "min_soc_on_grid": floor, "fd_soc": fd_soc | int, "fd_pwr": fd_power | int,
              "second_work_mode": "SelfUse"} }}
        {% else %}
          {{ {"start": "17:30", "end": "21:29", "work_mode": "SelfUse", "min_soc_on_grid": floor} }}
        {% endif %}
    sequence:
      - if: "{{ is_state('input_boolean.hh_dry_run', 'on') }}"
        then:
          - action: notify.notify
            data:
              title: Happy Hour (dry run)
              message: "Would set 17:30-21:29 to {{ evening }}"
        else:
          - action: foxess_cloud.set_schedule
            data:
              groups:
                - { start: "00:00", end: "17:29", work_mode: SelfUse, min_soc_on_grid: "{{ floor }}" }
                - "{{ evening }}"
                - { start: "21:30", end: "23:59", work_mode: SelfUse, min_soc_on_grid: "{{ floor }}" }

automation:
  # 17:20 - set tonight's cut-off from reserve (write 1 of max 2 per day)
  - id: hh_arm
    alias: Happy Hour - arm tonight
    triggers: [{ trigger: time, at: "17:20:00" }]
    conditions: [{ condition: state, entity_id: input_boolean.hh_enabled, state: "on" }]
    actions:
      - action: script.foxess_apply_schedule
        data:
          fd_enabled: true
          fd_soc: "{{ states('sensor.hh_reserve_soc') | int }}"
          fd_power: "{{ states('input_number.hh_fd_power_w') | int }}"
      - action: notify.notify
        data:
          title: Happy Hour armed
          message: >
            Cut-off {{ states('sensor.hh_reserve_soc') }}%, SoC now {{ states('sensor.fox_ess_60kb103062cb096_battery_soc') }}%,
            solar tomorrow {{ states('sensor.energy_production_tomorrow') if has_value('sensor.energy_production_tomorrow') else 'no forecast' }} kWh.

  # 17:29 - pull fresh daily totals so pre-17:30 solar export isn't counted in the window
  - id: hh_pre_window_refresh
    alias: Happy Hour - refresh before window
    triggers: [{ trigger: time, at: "17:29:00" }]
    conditions: [{ condition: state, entity_id: input_boolean.hh_enabled, state: "on" }]
    actions:
      - action: button.press
        target: { entity_id: button.fox_ess_60kb103062cb096_refresh_all_data }

  # 35c cap reached - keep selling at 10c only with real surplus (write 2)
  # Daily feed-in updates every ~15 min, so this can overshoot the cap by ~1 kWh (sold at 10c).
  - id: hh_cap_reached
    alias: Happy Hour - 35c cap reached
    triggers:
      - trigger: template
        value_template: >
          {{ states('sensor.hh_export_window') | float(0) >= states('input_number.hh_cap_kwh') | float(15) }}
    conditions:
      - { condition: state, entity_id: input_boolean.hh_enabled, state: "on" }
      - { condition: time, after: "17:30:00", before: "21:30:00" }
    actions:
      - if:
          - condition: template
            value_template: >
              {% set fc = 'sensor.energy_production_tomorrow' %}
              {{ states('sensor.hh_surplus_kwh') | float(0) < states('input_number.hh_surplus_min_kwh') | float(3)
                 or (has_value(fc) and states(fc) | float(0) < states('input_number.hh_poor_solar_kwh') | float(30)) }}
        then:
          - action: script.foxess_apply_schedule
            data: { fd_enabled: false, fd_soc: 100, fd_power: 0 }
          - action: notify.notify
            data:
              message: "35c cap hit ({{ states('sensor.hh_export_window') }} kWh). Stopped export, holding {{ states('sensor.fox_ess_60kb103062cb096_battery_soc') }}%."
        else:
          - action: notify.notify
            data:
              message: "35c cap hit. Surplus {{ states('sensor.hh_surplus_kwh') }} kWh - selling down to {{ states('sensor.hh_reserve_soc') }}% at 10c."

  # 21:30 - snapshot meters for overnight learning
  - id: hh_snapshot_night
    alias: Happy Hour - snapshot 21:30
    triggers: [{ trigger: time, at: "21:30:00" }]
    actions:
      - action: input_number.set_value
        target: { entity_id: input_number.hh_load_at_2130 }
        data: { value: "{{ states('sensor.hh_load_total') | float(0) }}" }
      - action: input_number.set_value
        target: { entity_id: input_number.hh_import_at_2130 }
        data: { value: "{{ states('sensor.hh_import_total') | float(0) }}" }

  # 07:00 - learn overnight load (EMA, alpha 0.25) and flag any overnight import
  - id: hh_learn_morning
    alias: Happy Hour - learn overnight load
    triggers: [{ trigger: time, at: "07:00:00" }]
    variables:
      load_kwh: "{{ (states('sensor.hh_load_total') | float(0) - states('input_number.hh_load_at_2130') | float(0)) | round(2) }}"
      import_kwh: "{{ (states('sensor.hh_import_total') | float(0) - states('input_number.hh_import_at_2130') | float(0)) | round(2) }}"
    actions:
      - if: "{{ 0 < load_kwh < 40 }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.hh_overnight_load_avg_kwh }
            data:
              value: "{{ (0.75 * states('input_number.hh_overnight_load_avg_kwh') | float(6) + 0.25 * load_kwh) | round(2) }}"
      - if: "{{ import_kwh > 0.5 }}"
        then:
          - action: notify.notify
            data:
              title: Overnight grid import
              message: "Imported {{ import_kwh }} kWh at ~42c overnight. Raise reserve margin or morning buffer."
