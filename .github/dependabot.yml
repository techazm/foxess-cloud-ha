# Dependabot: at most one routine PR twice a month (1st and 15th), to save Actions minutes.
#
# - Version updates (patch and minor) for every ecosystem and folder are bundled into a
#   single PR by the `daily` multi-ecosystem group (name kept so open PRs carry on).
# - Security updates open as soon as an advisory lands, grouped to one PR per folder.
#   They can need a major bump: check CI before merging.
# - Majors never open PRs. .github/workflows/dependency-report.yml lists them in one
#   monthly issue so they are upgraded deliberately.
version: 2

multi-ecosystem-groups:
  daily:
    schedule:
      # Twice a month to save Actions minutes. Security updates still open straight away.
      interval: cron
      cronjob: "0 7 1,15 * *"
      timezone: Australia/Sydney
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)

updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: daily
    patterns: ['*']
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
